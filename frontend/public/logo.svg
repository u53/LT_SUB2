<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">朗涂云 API</title>
  <desc id="desc">Langtu Cloud API 的 LT 字母标志，配青蓝渐变与云弧线。</desc>
  <defs>
    <linearGradient id="lt-bg" x1="72" y1="44" x2="442" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142B56"/>
      <stop offset=".52" stop-color="#0A1A39"/>
      <stop offset="1" stop-color="#061127"/>
    </linearGradient>
    <radialGradient id="lt-ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 92) rotate(51) scale(342 382)">
      <stop stop-color="#3E68B0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3E68B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lt-brand" x1="140" y1="120" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F4BD"/>
      <stop offset=".48" stop-color="#39D9E7"/>
      <stop offset="1" stop-color="#3875F6"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#lt-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#lt-ambient)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#A5BFFF" stroke-opacity=".16" stroke-width="1.5"/>

  <!-- 云弧：表示云服务与 API 接入 -->
  <g fill="none" stroke="url(#lt-brand)" stroke-linecap="round" stroke-width="18" opacity=".55">
    <path d="M150 196c0-42 34-76 76-76 30 0 56 17 69 42 8-4 17-6 27-6 33 0 60 27 60 60"/>
  </g>

  <!-- LT 字母标志 -->
  <g fill="url(#lt-brand)">
    <path d="M158 232h44v138h96v44H158z"/>
    <path d="M262 232h150v44h-53v138h-44V276h-53z"/>
  </g>
</svg>
